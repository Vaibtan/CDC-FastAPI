global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "ingestor"
    static_configs:
      - targets: ["ingestor:9090"]
    metrics_path: /metrics

  - job_name: "control"
    static_configs:
      - targets: ["control:9091"]
    metrics_path: /metrics

  - job_name: "replayer"
    static_configs:
      - targets: ["replayer:9092"]
    metrics_path: /metrics

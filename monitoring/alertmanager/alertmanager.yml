# Alertmanager configuration for WalStream CDC platform.
#
# Routes incoming alerts to the appropriate receiver based on severity.
# Critical alerts use shorter intervals to ensure rapid notification.

global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/REPLACE/WITH/WEBHOOK_URL"

route:
  receiver: "slack-notifications"
  group_by: ["alertname"]
  group_wait: 5m
  group_interval: 5m
  repeat_interval: 1h

  routes:
    # Critical alerts get shorter intervals for faster escalation.
    - match:
        severity: critical
      receiver: "slack-notifications"
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 15m

receivers:
  - name: "slack-notifications"
    slack_configs:
      - channel: "#walstream-alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
        text: >-
          *Alert:* {{ .CommonLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook_url }}

# Inhibition rules suppress lower-severity alerts when a higher-severity
# alert is already firing for the same component.
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["component"]

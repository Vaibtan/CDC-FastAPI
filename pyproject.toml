[project]
name = "walstream-cdc"
version = "1.0.0"
description = "WalStream CDC - Change Data Capture system with FastAPI, PostgreSQL, Redis, and Kafka"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    # Database
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "psycopg2-binary",
    # Message Queues
    "redis",
    "aiokafka",
    "kafka-python",
    # gRPC
    "grpcio",
    "grpcio-tools",
    "protobuf",
    # Authentication
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    # Observability
    "prometheus-client",
    # HTTP Client
    "httpx",
    # Utilities
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "aiosqlite",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["walstream_proto*", "control*", "ingestor*", "replayer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["control/tests", "walstream-proto/tests", "tests"]